[project]
name = "email-mcp"
version = "2.1.0"
description = "Outlook (classic, Windows COM) email + calendar as a CLI and MCP server — no Azure, no OAuth."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kerod Kibatu" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "outlook", "email", "calendar", "windows", "com"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pywin32>=306 ; sys_platform == 'win32'",
    "typer>=0.12",
    "mcp>=1.2",
]

[project.urls]
Homepage = "https://github.com/kerodkibatu/email-mcp"
Repository = "https://github.com/kerodkibatu/email-mcp"

[project.scripts]
email = "email_mcp.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/email_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
